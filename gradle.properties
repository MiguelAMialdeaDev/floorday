# The PC runs short of memory on long builds: conservative limits.
org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8 -XX:+UseParallelGC
kotlin.daemon.jvmargs=-Xmx2g
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
kotlin.code.style=official
# iOS klibs compile on any host; linking the framework requires a Mac. Silences the warning.
kotlin.native.ignoreDisabledTargets=true

# App versionName. The release versionCode comes from the git commit count.
floorday.versionName=0.0.1
