# El PC se queda corto de memoria con builds largos: límites contenidos.
org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8 -XX:+UseParallelGC
kotlin.daemon.jvmargs=-Xmx2g
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
kotlin.code.style=official
# Los klibs de iOS compilan en cualquier host; enlazar el framework exige Mac. Silencia el aviso.
kotlin.native.ignoreDisabledTargets=true

# versionName de la app. El versionCode de release sale del número de commits de git.
floorday.versionName=0.0.1
